<!doctype html><html lang="ko" data-app="run"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>앱 받기</title>
<link rel="icon" href="runapp/icons/run.png">
<style>body{margin:0;font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#F4F0E6;color:#1E3B2F}
main{max-width:460px;margin:0 auto;padding:28px 18px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
img{width:120px;height:120px;border-radius:28px;box-shadow:0 8px 22px rgba(30,59,47,.18)}h1{margin:0;font-size:26px}#msg{margin:0;color:#4F6B5E;font-size:16px}
a.b{display:block;width:100%;box-sizing:border-box;background:#1E3B2F;color:#fff;text-decoration:none;font-weight:800;font-size:18px;padding:16px;border-radius:16px}
ol{text-align:left;background:#FFFDF8;border-radius:16px;padding:16px 16px 16px 36px;margin:0;line-height:1.7;font-size:15px;width:100%;box-sizing:border-box}</style></head>
<body><main><img src="runapp/icons/run.png" alt=""><h1 id="t"></h1><p id="msg"></p>
<a class="b" id="dl" href="#">⬇ 설치 파일 받기</a>
<ol><li>위 단추로 받은 파일을 눌러요 (알림 창이나 <b>내 파일 → 다운로드</b>)</li><li>'출처를 알 수 없는 앱'이 나오면 <b>설정 → 이 출처 허용</b> → <b>설치</b></li><li>처음 열 때 <b>알림·위치</b>를 허용해요 (화면을 꺼도 <span id="w"></span>이 기록돼요)</li><li>새 판이 나오면 여기서 다시 받아 덮어 설치해요. 기록은 그대로예요</li></ol>
</main><script src="getapp.js"></script></body></html>
