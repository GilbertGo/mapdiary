<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포토스토리</title>
<meta name="description" content="사진 몇 장이, 이야기 한 장으로 — 휴대폰 사진 2~6장을 고르면 이야기 카드 한 장으로 만들어요">
<meta property="og:title" content="포토스토리 — 사진 몇 장이, 이야기 한 장으로">
<meta property="og:description" content="휴대폰 사진 2~6장을 고르면 이야기 카드 한 장으로 만들어요">

<meta name="apple-mobile-web-app-title" content="포토스토리">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!--
  포토스토리 (2026-11-20, 판 -283): Map Photo Diary 저장소 안의 따로 쓰는 작은 앱. 진호 님 앱(sisultong)과 상관없이 처음부터 새로 만듦.
  - 휴대폰 사진 2~6장 → (AI 열쇠가 있으면) Claude가 제목·한 줄·글 → 1080px 카드 그림 → 보내기·저장
  - 만든 카드는 이 휴대폰 브라우저 IndexedDB 'photostory'에만. 서버로 올리지 않음
  - AI 열쇠는 MPD와 같은 localStorage 'claudeKey'(같은 주소라 같이 씀) · 공유 열쇠 tripAiKey는 하루 tripAiN 횟수를 같이 셈
  - 원래 앱의 잘못(엉뚱한 'AI 사례' 문구, AI를 못 쓴다면서 단추는 그대로, 단어 중간 줄바꿈)을 되풀이하지 않게:
    AI가 없거나 실패해도 카드는 늘 만들어지고(날짜·장소 글), 그 사실을 한 줄로 알려 줌. 글은 모두 word-break:keep-all
-->
<style>
:root{--bg:#F2F5F9;--card:#fff;--ink:#14202E;--sub:#5B6B7C;--line:#E3E9F0;--blue:#2563EB;--blueSoft:#E8EFFB;--cream:#F6F1EA;--coral:#B4471F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;gap:12px;margin:10px 0 22px}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.top p{margin:4px 0 0;color:var(--sub);font-size:16px}
.me{margin-left:auto;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none}
.hero{background:var(--blue);color:#fff;border-radius:26px;padding:22px 22px 22px}
.hero h2{margin:0 0 8px;font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.hero p{margin:0 0 18px;font-size:16px;line-height:1.55;opacity:.95}
.hero .go{width:100%;height:60px;border:none;border-radius:18px;background:#fff;color:var(--blue);font-size:19px;font-weight:800}
.hero .go:disabled{opacity:.7}
.hero .ai{margin:12px 0 0;font-size:13.5px;line-height:1.5;opacity:.9;background:none;border:none;color:#fff;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.sec{margin:30px 0 4px;font-size:21px;font-weight:800}
.sec-sub{margin:0 0 14px;color:var(--sub);font-size:14.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.it{border:none;padding:0;background:var(--cream);border-radius:20px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.it img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#DDE4EC}
.it div{padding:12px 14px 14px}
.it small{display:block;color:var(--coral);font-weight:700;font-size:12.5px;margin-bottom:4px}
.it b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:16px;line-height:1.35}
.empty{background:#fff;border:1px dashed #C9D3DF;border-radius:20px;padding:26px 18px;text-align:center;color:var(--sub);font-size:15px;line-height:1.55}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet .in{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar b{flex:1;font-size:20px}
.ib{width:44px;height:44px;border:none;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(16,42,67,.08)}
.prev{width:100%;display:block;border-radius:22px;box-shadow:0 8px 28px rgba(16,42,67,.16);background:#E3EAF2;min-height:280px}
.st{font-size:13.5px;text-align:center;color:var(--sub);min-height:20px;margin:10px 4px 0;line-height:1.5}
.st.warn{color:#9A3412}
.opts{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
.seg{display:flex;background:#fff;border-radius:12px;padding:3px}
.seg button{border:none;background:none;border-radius:10px;height:36px;padding:0 14px;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--blueSoft);color:var(--blue)}
.dots{display:flex;gap:10px}
.dots button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.dots button.on{box-shadow:0 0 0 2px var(--ink)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:51;display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);max-width:560px;margin:0 auto}
.foot button{flex:1;height:56px;border:none;border-radius:16px;font-weight:800;font-size:17px;background:var(--blueSoft);color:var(--blue)}
.foot button.pri{flex:1.8;background:var(--blue);color:#fff}
.menu-bg{position:fixed;inset:0;z-index:60;background:rgba(10,20,30,.38);display:flex;align-items:flex-end;justify-content:center}
.menu{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
.menu h3{margin:8px 12px 6px;font-size:16px;color:var(--sub);font-weight:700}
.menu button.row{display:block;width:100%;border:none;background:none;text-align:left;padding:15px 12px;font-size:17px;font-weight:600;border-radius:12px}
.menu button.row:active{background:var(--bg)}
.menu button.red{color:#C2410C}
.menu p{margin:4px 12px 12px;color:var(--sub);font-size:14.5px;line-height:1.55}
.menu input{width:calc(100% - 24px);margin:0 12px 10px;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px}
.menu .two{display:flex;gap:8px;margin:0 12px}
.menu .two button{flex:1;height:50px;border:none;border-radius:12px;font-weight:700;background:var(--blueSoft);color:var(--blue)}
.menu .two button.pri{background:var(--blue);color:#fff}
.busy{position:fixed;inset:0;z-index:70;background:rgba(242,245,249,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-size:17px;font-weight:700}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #CFDDF5;border-top-color:var(--blue);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:rgba(20,32,46,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;max-width:min(90vw,480px);text-align:center;line-height:1.45;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>포토스토리</h1><p>사진 몇 장이, 이야기 한 장으로</p></div>
    <button class="me" id="meBtn" aria-label="설정"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M6.2 18.4c1.4-2 3.4-3 5.8-3s4.4 1 5.8 3"/></svg></button>
  </div>
  <section class="hero">
    <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 1.5l2.4 7.1 7.1 2.4-7.1 2.4L12 20.5l-2.4-7.1L2.5 11l7.1-2.4z"/></svg>새로 만들기</h2>
    <p>휴대폰 사진 2~6장을 고르면 이야기 카드 한 장으로 만들어요. 모양·색도 고를 수 있어요.</p>
    <button class="go" id="goBtn">카드 만들기</button>
    <button class="ai" id="aiLine" hidden></button>
  </section>
  <h2 class="sec" id="cnt">만든 카드</h2>
  <p class="sec-sub">눌러서 크게 보고, 그대로 보내거나 갤러리에 저장하세요</p>
  <div id="list"></div>
</div>
<input type="file" id="pick" accept="image/*" multiple hidden>
<div class="toast" id="toast"></div>
<script>
'use strict';
const FA_MODEL = 'claude-haiku-5-5', TALK_SDK = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm', AI_SHARE_MAX = 30;
const F = `'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif`;
const PAL = {   // 카드 색: 라벨·줄·바탕
  coral: { n: '산호', label: '#FFC9A8', bar: '#FF8A6B', bg: '#F6F1EA', ink: '#1B2B3A', dot: '#FF8A6B' },
  blue:  { n: '파랑', label: '#BFD7FF', bar: '#2563EB', bg: '#EEF3FB', ink: '#14202E', dot: '#2563EB' },
  plum:  { n: '보라', label: '#E3D6FF', bar: '#7C3AED', bg: '#F3F0FB', ink: '#1F1633', dot: '#7C3AED' },
  ink:   { n: '먹색', label: '#E7E5E4', bar: '#1C1917', bg: '#F5F5F4', ink: '#1C1917', dot: '#1C1917' },
};
const $ = s => document.querySelector(s);
const el = (t, a, ...k) => { const e = document.createElement(t); for (const [x, v] of Object.entries(a || {})) { if (v == null) continue; if (x.startsWith('on')) e.addEventListener(x.slice(2), v); else if (x === 'text') e.textContent = v; else if (x === 'html') e.innerHTML = v; else e.setAttribute(x, v); } k.flat().forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c))); return e; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let toastT; function toast(s, long) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), long ? 4200 : 2400); }
const pad = n => String(n).padStart(2, '0'), dTxt = ts => { const d = new Date(ts); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; };

// ── AI 열쇠: MPD와 같은 자리(같은 주소라 같이 씀)
const ownKey = () => String(ls.get('claudeKey', '') || '').trim();
const shared = () => { if (ownKey()) return null; const s = ls.get('tripAiKey', null); return s && s.k ? s : null; };
const sharedLeft = () => { const N = ls.get('tripAiN', null) || {}, d = new Date().toDateString(); return Math.max(0, AI_SHARE_MAX - (N.d === d ? N.n : 0)); };
const aiKey = () => ownKey() || (shared() && sharedLeft() > 0 ? shared().k : '');
const aiCount = () => { if (!shared()) return; const N = ls.get('tripAiN', null) || {}, d = new Date().toDateString(); ls.set('tripAiN', { d, n: (N.d === d ? N.n : 0) + 1 }); };
const aiState = () => ownKey() ? { on: true, t: 'AI 글쓰기 켜짐 · 내 열쇠' } : shared() ? (sharedLeft() > 0 ? { on: true, t: `AI 글쓰기 켜짐 · 함께 쓰는 열쇠 · 오늘 ${sharedLeft()}번 남음` } : { on: false, t: '함께 쓰는 열쇠를 오늘 다 썼어요 · 내일 다시 켜져요' }) : { on: false, t: 'AI 열쇠를 넣으면 AI가 제목과 글을 써요' };
function aiWhy(e) {   // 실패 까닭을 쉬운 말로
  const s = (e && (e.status || '')) + ' ' + String(e && e.message || '');
  if (!navigator.onLine || /Failed to fetch|NetworkError|network/i.test(s)) return '인터넷 연결이 끊겼어요';
  if (/\b401\b|authentication|invalid x-api-key/i.test(s)) return 'AI 열쇠가 맞지 않아요';
  if (/\b429\b|rate/i.test(s)) return 'AI를 너무 자주 불렀어요 · 1분 뒤 다시 해 주세요';
  if (/\b529\b|overloaded|\b5\d\d\b/i.test(s)) return 'AI 서버가 지금 바빠요 · 잠시 뒤 다시 해 주세요';
  if (/credit|billing|balance/i.test(s)) return 'AI 열쇠의 잔액이 모자라요';
  return 'AI 답을 받지 못했어요';
}

// ── 저장(이 휴대폰 브라우저 안 IndexedDB)
const db = new Promise((ok, no) => { const r = indexedDB.open('photostory', 1); r.onupgradeneeded = () => r.result.createObjectStore('cards', { keyPath: 'id' }); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const tx = async (mode, fn) => { const d = await db; return new Promise((ok, no) => { const t = d.transaction('cards', mode), s = t.objectStore('cards'), r = fn(s); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); }); };
const dbAll = () => tx('readonly', s => s.getAll()), dbPut = c => tx('readwrite', s => s.put(c)), dbDel = id => tx('readwrite', s => s.delete(id));

// ── 사진: 찍은 시각·위치(EXIF) 읽기, 줄이기
async function exif(file) {
  try {
    const v = new DataView(await file.slice(0, 196608).arrayBuffer()); if (v.getUint16(0) !== 0xFFD8) return {};
    let o = 2; while (o < v.byteLength - 4) { const m = v.getUint16(o), len = v.getUint16(o + 2); if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) { o += 10; break; } o += 2 + len; if (m === 0xFFDA) return {}; }
    if (o >= v.byteLength - 8) return {};
    const le = v.getUint16(o) === 0x4949, u16 = p => v.getUint16(o + p, le), u32 = p => v.getUint32(o + p, le);
    const ifd = p => { const n = u16(p), r = {}; for (let i = 0; i < n; i++) { const e = p + 2 + i * 12; r[u16(e)] = { t: u16(e + 2), c: u32(e + 4), v: e + 8 }; } return r; };
    const str = e => { const p = e.c > 4 ? u32(e.v) : e.v; let s = ''; for (let i = 0; i < e.c - 1; i++) s += String.fromCharCode(v.getUint8(o + p + i)); return s; };
    const rat3 = e => { const p = u32(e.v); const r = k => u32(p + k * 8) / (u32(p + k * 8 + 4) || 1); return r(0) + r(1) / 60 + r(2) / 3600; };
    const out = {}, I0 = ifd(u32(4));
    if (I0[0x8769]) { const E = ifd(u32(I0[0x8769].v)); const d = E[0x9003] || E[0x9004]; if (d) { const m = /(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/.exec(str(d)); if (m) out.ts = new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime(); } }
    if (I0[0x8825]) { const G = ifd(u32(I0[0x8825].v)); if (G[2] && G[4]) { let la = rat3(G[2]), ln = rat3(G[4]); if (G[1] && str({ ...G[1], c: 2 }) === 'S') la = -la; if (G[3] && str({ ...G[3], c: 2 }) === 'W') ln = -ln; if (la && ln && Math.abs(la) <= 90) { out.la = la; out.ln = ln; } } }
    return out;
  } catch { return {}; }
}
async function shrink(blob, max, q) {
  const bm = await createImageBitmap(blob), s = Math.min(1, max / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
  c.width = Math.round(bm.width * s); c.height = Math.round(bm.height * s); c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); try { bm.close(); } catch {}
  return new Promise(r => c.toBlob(r, 'image/jpeg', q || .88));
}
const b64 = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(String(f.result).split(',')[1]); f.readAsDataURL(b); });
async function placeName(la, ln) {   // 찍은 곳 이름(OpenStreetMap). 못 찾으면 빈칸
  try { const ctl = new AbortController(); setTimeout(() => ctl.abort(), 8000);
    const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=ko&lat=${la.toFixed(5)}&lon=${ln.toFixed(5)}`, { signal: ctl.signal })).json(), a = j.address || {};
    const poi = /^(tourism|historic|leisure|natural|amenity|building|place)$/.test(j.category || '') ? j.name : '';
    const big = a.city || a.county || a.province || a.state || '', small = poi || a.tourism || a.leisure || a.neighbourhood || a.quarter || a.suburb || a.village || a.town || '';
    return [big, small].filter((x, i, A) => x && A.indexOf(x) === i).join(' ').slice(0, 30);
  } catch { return ''; }
}

// ── AI 글
async function aiWrite(c) {
  const key = aiKey(); if (!key) throw Object.assign(new Error('nokey'), { nokey: 1 });
  const content = [];
  for (const [i, p] of c.photos.slice(0, 6).entries()) content.push({ type: 'text', text: `[사진 ${i + 1}]${p.ts ? ' ' + new Date(p.ts).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''}` }, { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await b64(await shrink(p.b, 768, .8)) } });
  const facts = [c.ts ? `찍은 날: ${dTxt(c.ts)}` : '', c.place ? `찍은 곳(지도에서 찾음): ${c.place}` : ''].filter(Boolean).join('\n') || '(날짜·장소 정보 없음)';
  content.push({ type: 'text', text: `위는 내가 찍은 사진이고, 아래는 사진 파일에서 읽은 사실이에요.\n${facts}\n\n이걸로 '사진 이야기' 카드 글을 한국어로 써 주세요.\n- title: 그날을 담은 짧고 감성적인 제목(16자 안팎, 사진에 실제로 보이는 것으로)\n- sub: 장소나 함께한 것을 담은 짧은 한 줄(20자 안팎, 위 장소가 있으면 그 이름 그대로)\n- text: 2~3문장, 담백하게. 사진에 보이지 않거나 위 사실에 없는 이름·숫자·사람 관계는 지어내지 말 것\nJSON 하나만 답하세요: {"title":"…","sub":"…","text":"…"}` });
  const { default: Anthropic } = await import(TALK_SDK);
  const res = await new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true, maxRetries: 1, timeout: 60000 }).messages.create({ model: FA_MODEL, max_tokens: 700, messages: [{ role: 'user', content }] });
  aiCount();
  const u = res.usage || {}, log = ls.get('labAiLog', []); log.unshift({ at: Date.now(), kind: '포토스토리(따로 앱)', inT: u.input_tokens || 0, outT: u.output_tokens || 0 }); ls.set('labAiLog', log.slice(0, 100));
  const tb = (res.content || []).filter(q => q.type === 'text').map(q => q.text).join(''), j = JSON.parse((/\{[\s\S]*\}/.exec(tb) || ['{}'])[0]);
  if (!j.title) throw new Error('AI 답에 제목이 없어요');
  c.title = String(j.title).trim().slice(0, 40); c.sub = String(j.sub || '').trim().slice(0, 40); c.text = String(j.text || '').trim().slice(0, 300); c.ai = true;
}
function plainText(c) {   // AI 없이: 날짜·장소로
  const d = c.ts ? new Date(c.ts) : null, mon = d ? `${d.getMonth() + 1}월 ${d.getDate()}일` : '';
  c.title = c.place ? `${c.place.split(' ').pop()}에서` : (mon ? `${mon}의 기록` : '그날의 기록');
  c.sub = [c.place, mon].filter(Boolean).join(' · ');
  c.text = ''; c.ai = false;
}

// ── 카드 그림(1080px JPEG = 보내고 저장하는 그림 그대로)
function wrapLines(g, s, w, max) {   // 낱말 단위로 줄바꿈(단어 중간에서 끊지 않음). 한 낱말이 너무 길 때만 글자로
  const L = []; for (const para of String(s || '').split('\n')) { let cur = '';
    for (const word of para.split(/\s+/).filter(Boolean)) { const t = cur ? cur + ' ' + word : word;
      if (g.measureText(t).width <= w) { cur = t; continue; }
      if (cur) L.push(cur); cur = '';
      if (g.measureText(word).width <= w) cur = word; else { for (const ch of word) { if (g.measureText(cur + ch).width > w && cur) { L.push(cur); cur = ch; } else cur += ch; } } }
    if (cur) L.push(cur); }
  if (L.length > max) { L.length = max; let l = L[max - 1]; while (l && g.measureText(l + '…').width > w) l = l.slice(0, -1); L[max - 1] = l + '…'; }
  return L;
}
async function render(c) {
  try { await document.fonts.load(`800 72px 'Pretendard Variable'`); } catch {}
  const P = PAL[c.color] || PAL.coral, sq = c.shape === 'square', W = 1080, H = sq ? 1080 : 1350, M = 48;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
  const fit = (bm, x, y, w, h, rad) => { g.save(); g.beginPath(); g.roundRect(x, y, w, h, rad); g.clip(); const s = Math.max(w / bm.width, h / bm.height), dw = bm.width * s, dh = bm.height * s; g.drawImage(bm, x + (w - dw) / 2, y + (h - dh) / 2.4, dw, dh); g.restore(); };
  const cov = c.photos[c.cov] || c.photos[0], rest = c.photos.filter(p => p !== cov).slice(0, 3);
  const CH = sq ? H : 800;
  try { const bm = await createImageBitmap(cov.b); fit(bm, 0, 0, W, CH, 0); bm.close && bm.close(); } catch { g.fillStyle = '#9FB3C8'; g.fillRect(0, 0, W, CH); }
  const gr = g.createLinearGradient(0, CH * (sq ? .3 : .42), 0, CH); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.7)'); g.fillStyle = gr; g.fillRect(0, 0, W, CH);
  g.font = `800 ${sq ? 66 : 72}px ${F}`; const tL = wrapLines(g, c.title, W - M * 2, 2);
  g.font = `500 36px ${F}`; const sub = c.sub ? wrapLines(g, c.sub, W - M * 2, 1)[0] : '';
  let bodyL = []; if (c.text) { g.font = `500 ${sq ? 34 : 40}px ${F}`; bodyL = wrapLines(g, c.text, W - M * 2 - (sq ? 0 : 36), sq ? 2 : 3); }
  // 큰 사진 위 글(아래에서 위로 쌓음)
  let y = CH - (sq ? 70 : 56);
  if (sq && bodyL.length) { g.fillStyle = 'rgba(255,255,255,.9)'; g.font = `500 34px ${F}`; for (let i = bodyL.length - 1; i >= 0; i--) { g.fillText(bodyL[i], M, y); y -= 50; } y -= 22; }
  if (sub) { g.fillStyle = 'rgba(255,255,255,.9)'; g.font = `500 36px ${F}`; g.fillText(sub, M, y); y -= 70; }
  g.font = `800 ${sq ? 66 : 72}px ${F}`; g.fillStyle = '#fff'; g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 16;
  for (let i = tL.length - 1; i >= 0; i--) { g.fillText(tL[i], M, y); y -= sq ? 82 : 88; } g.shadowBlur = 0;
  g.fillStyle = P.label; g.font = `700 32px ${F}`; g.fillText(`사진 이야기${c.ts ? '  ·  ' + dTxt(c.ts) : ''}`, M, y - 6);
  if (!sq) {
    let by = 880;
    if (bodyL.length) { g.fillStyle = P.bar; g.fillRect(M, by - 34, 7, bodyL.length * 58 - 14); g.fillStyle = P.ink; g.font = `500 40px ${F}`; bodyL.forEach(l => { g.fillText(l, M + 32, by); by += 58; }); }
    if (rest.length) { const n = rest.length, gap = 20, th = bodyL.length ? 230 : H - 70 - 840, tw = (W - M * 2 - gap * (n - 1)) / n, ty = H - 70 - th;
      for (let i = 0; i < n; i++) { try { const bm = await createImageBitmap(rest[i].b); fit(bm, M + i * (tw + gap), ty, tw, th, 26); bm.close && bm.close(); } catch {} } }
    g.fillStyle = 'rgba(27,43,58,.4)';
  } else g.fillStyle = 'rgba(255,255,255,.6)';
  g.font = `600 26px ${F}`; g.textAlign = 'right'; g.fillText('포토스토리', W - M, H - 26); g.textAlign = 'left';
  return new Promise(r => cv.toBlob(r, 'image/jpeg', .9));
}

// ── 첫 화면
function drawAi() { const s = aiState(), b = $('#aiLine'); b.hidden = s.on; b.textContent = s.on ? '' : `지금은 AI 없이 날짜·장소로 글을 만들어요 · ${s.t} ›`; }
const urls = []; const objUrl = b => { const u = URL.createObjectURL(b); urls.push(u); return u; };
async function drawList() {
  urls.splice(0).forEach(u => URL.revokeObjectURL(u));
  const all = (await dbAll().catch(() => [])).sort((a, b) => b.at - a.at), box = $('#list'); box.textContent = '';
  $('#cnt').textContent = all.length ? `만든 카드 ${all.length}장` : '만든 카드';
  if (!all.length) { box.append(el('div', { class: 'empty', html: '아직 만든 카드가 없어요<br>위의 <b>카드 만들기</b>를 눌러 사진을 골라 보세요' })); return; }
  const grid = el('div', { class: 'grid' });
  all.forEach(c => grid.append(el('button', { class: 'it', onclick: () => openCard(c) }, el('img', { src: objUrl(c.th || c.photos[0].b), alt: '' }), el('div', {}, el('small', { text: '사진 이야기' }), el('b', { text: c.title })))));
  box.append(grid);
}

// ── 만들기
$('#goBtn').onclick = () => { $('#pick').value = ''; $('#pick').click(); };
$('#aiLine').onclick = () => settings();
$('#pick').onchange = async e => {
  let files = [...e.target.files].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if (files.length < 2) { toast(files.length ? '사진을 2장 이상 골라 주세요' : '사진을 고르지 않았어요'); return; }
  if (files.length > 6) { toast(`처음 6장으로 만들어요 (${files.length}장 고름)`, true); files = files.slice(0, 6); }
  const busy = el('div', { class: 'busy' }, el('div', { class: 'spin' }), el('div', { id: 'busyT', text: '사진을 읽는 중…' })); document.body.append(busy);
  const say = t => { const x = document.getElementById('busyT'); if (x) x.textContent = t; };
  try {
    const photos = []; let bad = 0;
    for (const f of files) { try { const x = await exif(f); photos.push({ b: await shrink(f, 1600), ts: x.ts || f.lastModified || 0, la: x.la, ln: x.ln }); } catch { bad++; } }
    if (photos.length < 2) { busy.remove(); toast(bad ? '이 휴대폰에서 열 수 없는 사진 형식이에요 · 다른 사진으로 해 주세요' : '사진을 2장 이상 골라 주세요', true); return; }
    photos.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const c = { id: 'ps_' + Date.now().toString(36), at: Date.now(), photos, cov: 0, shape: 'tall', color: 'coral', ts: photos[0].ts || Date.now() };
    const g = photos.find(p => p.la != null); if (g) { say('찍은 곳을 찾는 중…'); c.place = await placeName(g.la, g.ln); }
    plainText(c); let note = '';
    if (aiKey()) { say('✨ AI가 사진을 보고 글을 쓰는 중…'); try { await aiWrite(c); } catch (er) { note = `⚠ ${aiWhy(er)} · 날짜·장소 글로 만들었어요. ⋯ 에서 'AI로 다시 쓰기'를 눌러 보세요`; } }
    say('카드를 그리는 중…');
    c.th = await shrink(c.photos[c.cov].b, 600, .82); c.card = await render(c); await dbPut(c);
    busy.remove(); if (bad) toast(`${bad}장은 열 수 없는 형식이라 빼고 만들었어요`, true);
    drawList(); openCard(c, note);
  } catch (er) { busy.remove(); toast('카드를 만들지 못했어요 · ' + String(er && er.message || er).slice(0, 60), true); }
};

// ── 카드 크게 보기
function openCard(c, note) {
  const sh = el('div', { class: 'sheet', role: 'dialog', 'aria-label': '포토스토리 카드' }), img = el('img', { class: 'prev', alt: c.title }), st = el('div', { class: 'st' });
  let u = ''; const show = () => { if (u) URL.revokeObjectURL(u); u = URL.createObjectURL(c.card); img.src = u; };
  const setSt = (t, warn) => { st.textContent = t || ''; st.classList.toggle('warn', !!warn); };
  const redraw = async () => { c.th = await shrink(c.photos[c.cov].b, 600, .82); c.card = await render(c); await dbPut(c); show(); drawList(); };
  const segB = (v, t) => el('button', { class: c.shape === v ? 'on' : '', onclick: async ev => { if (c.shape === v) return; c.shape = v; [...ev.target.parentNode.children].forEach(b => b.classList.toggle('on', b === ev.target)); await redraw(); } }, t);
  const dot = k => el('button', { class: c.color === k ? 'on' : '', 'aria-label': PAL[k].n, style: `background:${PAL[k].dot}`, onclick: async ev => { if (c.color === k) return; c.color = k; [...ev.target.parentNode.children].forEach(b => b.classList.toggle('on', b === ev.target)); await redraw(); } });
  const close = () => { if (u) URL.revokeObjectURL(u); sh.remove(); foot.remove(); };
  const fname = () => `PhotoStory_${dTxt(c.ts).replace(/\./g, '')}_${c.id.slice(-4)}.jpg`;
  const save = () => { const a = el('a', { href: URL.createObjectURL(c.card), download: fname() }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  const send = async () => { const f = new File([c.card], fname(), { type: 'image/jpeg' });
    try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: c.title }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    save(); toast('공유 창을 열 수 없어 휴대폰에 저장했어요'); };
  const more = () => menu('카드', [
    ['대표 사진 바꾸기', async () => { c.cov = (c.cov + 1) % c.photos.length; await redraw(); toast(`대표 사진 ${c.cov + 1} / ${c.photos.length}`); }],
    ['제목·글 고치기', async () => { const t = prompt('제목', c.title); if (t == null) return; c.title = t.trim() || c.title; const s = prompt('한 줄 (장소 등)', c.sub || ''); if (s != null) c.sub = s.trim(); const w = prompt('글', c.text || ''); if (w != null) c.text = w.trim(); await redraw(); }],
    ['AI로 다시 쓰기', async () => {
      if (!aiKey()) { setSt(aiState().t + ' · 오른쪽 위 ⚙ 에서 넣을 수 있어요', true); settings(); return; }
      setSt('✨ AI가 사진을 보고 글을 쓰는 중…');
      try { await aiWrite(c); await redraw(); setSt('✨ AI가 쓴 글이에요 · 사진과 다르면 ⋯ 에서 고쳐 주세요'); } catch (er) { setSt(`⚠ ${aiWhy(er)} · 글은 그대로 두었어요`, true); } }],
    ['카드 지우기', async () => { if (!confirm('이 카드를 지울까요? 되돌릴 수 없어요')) return; await dbDel(c.id); close(); drawList(); toast('카드를 지웠어요'); }, 'red'],
  ]);
  sh.append(el('div', { class: 'in' },
    el('div', { class: 'bar' }, el('button', { class: 'ib', 'aria-label': '닫기', onclick: close, html: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' }),
      el('b', { text: '포토스토리' }), el('button', { class: 'ib', 'aria-label': '더보기', onclick: more, html: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>' })),
    img, st,
    el('div', { class: 'opts' }, el('div', { class: 'seg' }, segB('tall', '세로'), segB('square', '정사각')), el('div', { class: 'dots' }, Object.keys(PAL).map(dot)))));
  const foot = el('div', { class: 'foot' }, el('button', { class: 'pri', onclick: send }, '보내기'), el('button', { onclick: save }, '저장'));
  document.body.append(sh, foot); show();
  if (note) setSt(note, true); else if (c.ai) setSt('✨ AI가 쓴 글이에요 · 사진과 다르면 ⋯ 에서 고쳐 주세요');
  history.pushState({ card: 1 }, ''); const pop = () => { close(); removeEventListener('popstate', pop); }; addEventListener('popstate', pop);
}
function menu(title, rows) {
  const bg = el('div', { class: 'menu-bg', onclick: e => { if (e.target === bg) bg.remove(); } });
  bg.append(el('div', { class: 'menu' }, el('h3', { text: title }), rows.map(([t, fn, cls]) => el('button', { class: 'row' + (cls ? ' ' + cls : ''), onclick: () => { bg.remove(); fn(); } }, t))));
  document.body.append(bg);
}
function settings() {
  const s = aiState(), inp = el('input', { type: 'password', placeholder: 'sk-ant-… (Claude API 열쇠)', autocomplete: 'off' });
  const bg = el('div', { class: 'menu-bg', onclick: e => { if (e.target === bg) bg.remove(); } });
  bg.append(el('div', { class: 'menu' }, el('h3', { text: 'AI 글쓰기' }),
    el('p', { html: `<b>${s.on ? '✅' : '⚪'} ${s.t}</b><br>열쇠는 이 휴대폰 브라우저에만 두고, Map Photo Diary와 같이 써요. 사진은 글을 쓸 때만 AI에 보내고, 만든 카드는 이 휴대폰에만 저장돼요.` }),
    inp, el('div', { class: 'two' },
      ownKey() ? el('button', { onclick: () => { ls.set('claudeKey', ''); bg.remove(); drawAi(); toast('내 열쇠를 지웠어요'); } }, '내 열쇠 지우기') : null,
      el('button', { class: 'pri', onclick: () => { const k = inp.value.trim(); if (!/^sk-ant-/.test(k)) { toast('sk-ant- 로 시작하는 열쇠를 넣어 주세요'); return; } ls.set('claudeKey', k); bg.remove(); drawAi(); toast('✅ AI 글쓰기를 켰어요'); } }, '열쇠 저장'))));
  document.body.append(bg);
}
$('#meBtn').onclick = settings;
addEventListener('storage', drawAi); addEventListener('focus', drawAi);
drawAi(); drawList();
</script>
