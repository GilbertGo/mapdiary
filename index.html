<style>
:root{
  --ground:#F4F0E6; --card:#FFFDF8; --line:#E4DCCB; --ink:#1F2B24; --muted:#6B6A5E; --soft:#EFE9DC;
  --forest:#2D6A4F; --forest-soft:#E1EEE4; --forest-ink:#1B4332;
  --alert:#D1492A; --alert-soft:#FBE8E0; --alert-ink:#9E3219;
  --blue:#2F6FA8; --blue-soft:#E2ECF5; --blue-ink:#1D4F80;
  --amber:#B06A12; --amber-soft:#FAEEDA;
  --grey:#8A8676; --grey-soft:#EFE9DC;
  --accent:#F4A259; --pine:#1E3B2F;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 4px 14px rgba(60,45,20,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.5;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:20px 20px 110px}
h1{margin:0;font-size:24px;line-height:1.3;letter-spacing:-.03em;font-weight:700}
h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.clock{background:var(--ink);color:#fff;border-radius:24px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.clock .big{font-size:36px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}
.clock .lbl{font-size:13px;color:#B3AC9C}
.btn{height:54px;border-radius:16px;border:none;padding:0 20px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .08s,filter .15s}
.btn.full{width:100%}
.btn.big{height:60px;font-size:18px}
.btn.primary{background:var(--forest);color:#fff}
.btn.danger{background:var(--alert);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.line{background:#fff;color:#2F3A33;box-shadow:inset 0 0 0 1px var(--line)}
.card .btn.line,.sheet .btn.line,details.more .btn.line{background:var(--soft);box-shadow:none}
.btn.small{height:44px;font-size:15px;padding:0 16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
label.f{display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:15px;color:#5A5A4E}
input[type=text],input[type=date],input[type=time],input[type=password]{height:54px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:17px;width:100%;color:var(--ink);transition:border-color .15s,background .15s}
input[type=text]:focus,input[type=date]:focus,input[type=time]:focus,input[type=password]:focus{outline:none;border-color:var(--blue);background:#fff}
input::placeholder{color:#B3AC9C}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=time],.sheet input[type=password],.card input[type=text]{background:var(--soft);border-color:transparent}
.sheet input:focus,.card input:focus{background:#fff!important;border-color:var(--blue)!important}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cnt{background:var(--card);border-radius:18px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.cnt b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.cnt span{font-size:13px;color:var(--muted)}
.cnt.warn{background:var(--alert-soft);box-shadow:none} .cnt.warn b{color:var(--alert-ink)} .cnt.warn span{color:var(--alert-ink)}
.note{font-size:16px;font-weight:600;color:#2D6A4F;line-height:1.5}
.gm-item{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px 16px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.gm-item .grow{display:flex;flex-direction:column;gap:2px;min-width:0}.gm-item b{font-size:18px}.gm-e{font-size:34px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:14px;flex:none}
.gm-best{font-size:12.5px;font-weight:800;color:#D9622B}
.gm-info{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted)}.gm-info b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.gm-area{display:flex;flex-direction:column;gap:12px;position:relative;user-select:none;-webkit-user-select:none}
.gm-over{display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.gm-over b{font-size:20px}
.g2-board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;background:var(--line);border-radius:18px;padding:8px;aspect-ratio:1}
.g2-c{background:var(--soft);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;transition:background .12s}
.gp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gp-c{aspect-ratio:1;border:none;border-radius:14px;background:var(--pine);box-shadow:var(--shadow);padding:0;display:flex;align-items:center;justify-content:center}
.gp-c .gp-f{display:none}.gp-c.on{background:var(--card);color:var(--pine)}.gp-c.on .gp-f{display:flex}.gp-c.ok{background:var(--soft);opacity:.75}
.n25-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.n25-c{aspect-ratio:1;border:none;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:24px;font-weight:800;color:var(--ink)}
.n25-c.done{background:var(--soft);color:transparent;box-shadow:none}.n25-c.bad{background:#FFD9C7}
.sn-cv{width:100%;aspect-ratio:1;border-radius:16px;box-shadow:var(--shadow);background:#F7FBFF}
.sn-pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-areas:'. u .' 'l d r';gap:6px;justify-content:center}
.sn-b{height:56px;border:none;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:22px;color:var(--pine);touch-action:none}
.sn-b.d0{grid-area:u}.sn-b.d1{grid-area:r}.sn-b.d2{grid-area:d}.sn-b.d3{grid-area:l}
.om-grid{display:grid;grid-template-columns:repeat(13,1fr);background:#F3D9A4;border-radius:12px;padding:4px;aspect-ratio:1;box-shadow:var(--shadow)}
.om-c{border:none;padding:0;background:linear-gradient(#8A6A32,#8A6A32) center/100% 1px no-repeat,linear-gradient(#8A6A32,#8A6A32) center/1px 100% no-repeat;position:relative;aspect-ratio:1}
.om-c.bk::after,.om-c.wh::after{content:'';position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#111);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.om-c.wh::after{background:radial-gradient(circle at 35% 30%,#fff,#D8D8D8)}.om-c.last::before{content:'';position:absolute;inset:38%;border-radius:50%;background:#FF5A3C;z-index:1}
.tk-card{display:flex;flex-direction:column;gap:10px;padding:14px}.tk-card.on{box-shadow:0 0 0 3px #FF8A4C,var(--shadow)}
.tk-live{max-height:42vh;min-height:120px;overflow-y:auto;font-size:16px;line-height:1.6}.tk-time{font-size:12px;font-weight:800;color:var(--muted);margin-top:8px}.tk-int{color:var(--muted)}
.tk-note{display:flex;flex-direction:column;gap:10px;padding:16px}.tk-tag{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}.tk-tag.ai{background:#FFE6D8;color:#D9622B}
.tk-topic{border-left:3px solid var(--pine);padding-left:10px}.tk-th{display:flex;gap:8px;align-items:baseline}.tk-th span{width:22px;height:22px;border-radius:50%;background:var(--pine);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}.tk-th small{color:var(--muted)}
.tk-final{background:linear-gradient(135deg,#E6F4FF,#FFF1E8);border:1.5px solid #BFE0F7;border-radius:16px;padding:14px 16px}.tk-final b.h{display:block;font-size:13px;font-weight:800;color:#0277BD;letter-spacing:.02em;margin-bottom:6px}
.tk-final ol{margin:0;padding-left:22px;font-size:17px;line-height:1.55;font-weight:600;color:var(--ink)}.tk-final ol li{margin:4px 0}.tk-final p{margin:0;font-size:16.5px;line-height:1.6;font-weight:600}
.tk-sec.todo{background:#FFF1E8}.tk-sec.todo li{list-style:'☐  '}.tk-more{border-top:1px dashed var(--line);padding-top:8px}.tk-more summary{cursor:pointer;font-weight:800;color:var(--muted);font-size:14px;padding:4px 0}.tk-more[open] summary{margin-bottom:8px}
.tk-note ul{margin:4px 0 0;padding-left:20px}.tk-note li{margin:2px 0}.tk-sec{background:var(--ground);border-radius:12px;padding:10px 12px}
.gm-h{margin:10px 0 0;font-size:17px}
.bp{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}.bp-l{font-size:13px;color:var(--muted);font-weight:700}
.bp-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bp-c{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 4px 0 12px;border-radius:999px;background:var(--c);color:#fff;font-weight:800;font-size:15px}
.bp-c button{border:none;background:none;color:#fff;opacity:.8;width:26px;height:30px;font-size:13px;padding:0}
.bp-add{display:inline-flex;gap:4px}.bp-in{width:110px;height:34px;border:1.5px solid var(--line);border-radius:999px;padding:0 12px;background:var(--ground);font-size:15px}
.bp-add button{width:34px;height:34px;border-radius:50%;border:none;background:var(--pine);color:#fff;font-size:18px;padding:0}
.bet-res{display:flex;flex-direction:column;align-items:center;gap:4px;background:linear-gradient(120deg,#FF8A4C,#FFB36B);color:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:0 8px 20px rgba(255,138,76,.35);animation:betpop .5s cubic-bezier(.2,1.6,.4,1)}
.bet-res span{font-size:44px;line-height:1}.bet-res b{font-size:26px}.bet-res small{font-size:14px;opacity:.95}
@keyframes betpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ld-cv,.wh-cv{width:100%;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}.wh-cv{aspect-ratio:1;max-width:420px;align-self:center;background:transparent;box-shadow:none;cursor:pointer}
.ld-names{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fg-pad{position:relative;height:58vh;min-height:320px;border-radius:20px;background:#102A43;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.fg-msg{position:absolute;left:0;right:0;top:16px;text-align:center;color:#fff;font-weight:800;font-size:17px;padding:0 16px;pointer-events:none}
.fg-dot{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:var(--c);box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 35%,transparent);animation:fgp 1s ease-in-out infinite alternate;pointer-events:none;transition:opacity .3s,transform .3s}
.fg-dot.lose{opacity:.15}.fg-dot.win{transform:scale(1.5);animation:none;box-shadow:0 0 0 18px rgba(255,255,255,.35)}
@keyframes fgp{to{transform:scale(1.12)}}
.lt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.lt-c{height:100px;border:none;border-radius:16px;background:var(--pine);color:#fff;font-size:30px;font-weight:900;box-shadow:var(--shadow);white-space:pre-line;line-height:1.3}
.lt-c.open{font-size:15px}.lt-c.ok{background:var(--soft);color:var(--muted)}.lt-c.bad{background:#FF8A4C}
.bb-who{text-align:center;font-size:20px;font-weight:900}.bb-range{text-align:center;font-size:52px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bb-disp{text-align:center;font-size:22px;font-weight:700;color:var(--muted);height:30px}
.bb-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bb-k{height:56px;border:none;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:22px;font-weight:800}.bb-k.ok{background:var(--accent);color:#fff}
.tn-clock{text-align:center;font-size:72px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tn-tab{display:flex;flex-direction:column;gap:4px}.tn-tab div{display:flex;gap:10px;align-items:baseline;background:var(--card);border-radius:12px;padding:8px 14px}.tn-tab div span{flex:1;font-weight:700}.tn-tab div small{color:var(--muted);width:60px;text-align:right}.tn-tab div.w{background:#FFE6D8}
.gm-pills{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.gm-pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--pine);font-weight:800;font-size:15px;text-decoration:none}
.mem{display:flex;align-items:center;gap:14px;background:var(--card,#FFFDF8);border:1.5px solid #FFD2B8;border-radius:18px;padding:12px 14px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.mem-th{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft,#EEE)}.mem-ic{display:flex;align-items:center;justify-content:center;color:var(--pine)}
.mem .grow{display:flex;flex-direction:column;gap:3px;min-width:0}.mem b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mem .sm{font-size:13px;color:var(--muted)}
.mem-tag{align-self:flex-start;background:#FFE9DC;color:#D9622B;font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px}.mem-go{font-size:26px;color:var(--muted);flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.cal-d{min-width:0;width:100%;min-height:0;position:relative;aspect-ratio:1/1.1;border:none;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0;gap:1px;font:inherit;color:var(--muted)}

.rh{background-image:var(--rh-art);background-position:45% center}
.rh-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,55,.38) 0%,rgba(6,30,55,0) 32%,rgba(6,30,55,0) 45%,rgba(6,30,55,.6) 78%,rgba(6,30,55,0) 100%)}
/* 2026-10-19 사용자 '아랫부분이 경계 없이 차차 흐려지게, 바탕색은 사진 중 밝은 부분 색으로': 그림 아래 150px가 바탕색으로 녹아들고, 러닝 시작 화면 바탕은 사진 하늘의 밝은 색 */

.upd-bg{align-items:flex-end;justify-content:center;padding:16px}

.cl-st{font-size:19px;font-weight:800;margin-top:2px}
.fa-bar{text-decoration:none;font-size:16px;margin-right:6px}.fa-bar + .r3-bgic{margin-left:0}
.fa-note{padding:16px;color:var(--muted);line-height:1.55}.fa-ico{font-size:26px;flex:none}

.fa-cap{font-family:'Gowun Batang',serif;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}

  if (lat == null || !ls.get('hideEnds', true)) return false;
  const R = trackLoad(t).map(q => [q[0], q[1]]); if (R.length < 2) return false;
  const T = trimEnds(R, null, HIDE_M); if (!T.R) return true;
  const a = R.indexOf(T.R[0]), b = R.lastIndexOf(T.R[T.R.length - 1]);
  let k = 0, best = Infinity; R.forEach((q, i) => { const d = dist(q[0], q[1], lat, lng); if (d < best) { best = d; k = i; } });
  return k < a || k > b || (best < HIDE_M && (dist(R[0][0], R[0][1], lat, lng) < HIDE_M || dist(R[R.length - 1][0], R[R.length - 1][1], lat, lng) < HIDE_M));
}

// 왜 못 썼는지 쉬운 말로 (Claude SDK 오류는 status, 앨범 저장 오류는 'cloud 403' 같은 것)
function famCapWhy(e, step) {

  if (step === 'album' || step === 'save') return st === 403 ? '앨범 권한이 없어요(다시 로그인해 보세요)' : `앨범에 저장하지 못했어요${st ? ` (${st})` : ''}`;
  if (m === 'empty') return 'Claude가 빈 답을 줬어요';
  if (st === 401) return 'Claude가 열쇠를 받지 않아요(틀렸거나 지워진 열쇠)';
  if (st === 403) return 'Claude 열쇠에 권한이 없어요';
  if (st === 400 && /credit|balance|billing/i.test(m)) return 'Claude 계정에 남은 금액이 없어요(콘솔에서 충전)';
  if (st === 404) return 'Claude 모델을 찾지 못했어요';
  if (st === 429) return 'Claude 사용 한도에 걸렸어요(잠시 뒤 다시)';

  if (!st) return '인터넷이 끊겼거나 Claude에 닿지 못했어요';
  return `Claude 오류 ${st}${m ? ' · ' + m.slice(0, 60) : ''}`;
}

        const today = el('button', { class: 'btn line full', text: al ? '오늘 공유하기' : '지금까지 공유하기', onclick: () => {
          const tr = trackLoad(id); if (tr.length < 2) return toast('아직 기록된 길이 거의 없어요. 조금 더 다닌 뒤에 공유해요');
          const wp = ls.get('walkPlaces:' + id, {});
          openBrag({ name: nameOf(), startPlace: wp.start || '출발 지점', meetPlace: wp.end || '지금 여기', startAt: tr[0][2], meetAt: tr[tr.length - 1][2], route: null, phase: 'go', live: true }, id, 0, false);
        } });
        if (!al || al.days.length < 2) return today;
        return el('div', { class: 'two' }, today, el('button', { class: 'btn line full', text: '여행 전체 공유하기', onclick: () => {
          const ai = albumInfo(aid); if (!ai) return toast('아직 기록된 길이 거의 없어요');
          if (!ls.get('walkPlaces:' + aid, {}).end) ai.meetPlace = '지금 여기';
          openBrag(Object.assign(ai, { live: true }), aid, 0, false);
        } }));
      })(),
      el('button', { class: 'btn primary full big', text: '끝내기', onclick: finish }),
      camIn, galIn,
      el('a', { class: 'link', href: './', style: 'align-self:center;color:var(--muted)', text: '처음으로 (다시 들어오면 이어서 기록해요)' })].filter(Boolean));
    stats();
  }
  setInterval(() => { if (id && !done) stats(); }, 15000);
  // 러닝·자전거는 시계를 1초마다 (지도는 다시 그리지 않아요)
  setInterval(() => { if (id && !done && !askResume && ['run', 'bike'].includes(M().k)) { tDur.textContent = fmtRunTime(runElapsed()); drawCad(); drawRun(); } }, 1000);
  // 같이 달리기: 10초마다(달리는 중이거나 화면을 보고 있을 때)
  setInterval(() => { if (crewGet() && (id && !done || document.visibilityState === 'visible')) crewTick(); }, 10000);
  if (id && !askResume) lockWake();
  draw();
  if (crewGet()) setTimeout(crewTick, 800);
}
</script>
</body>
</html>
